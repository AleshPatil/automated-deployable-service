name: Go CI/CD

on:
  push:
    branches: ["development"]
  merge_group:
    branches: ["development"]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Binary
        run: |
          echo "Building Go application..."
          go mod tidy
          go build -v -o go-app main.go

      - name: Deploy Binary
        run: |
          echo "Deploying application..."

          # Create deployment directory
          sudo mkdir -p /opt/go-app

          # Copy binary
          sudo cp go-app /opt/go-app/go-app

          # Set permissions
          sudo chmod +x /opt/go-app/go-app

      - name: Restart Service
        run: |
          echo "Restarting service..."
          sudo systemctl daemon-reload
          sudo systemctl restart go-app
          sudo systemctl status go-app --no-pager