name: Go CI/CD

on:
  push:
    branches: ["development"]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"

      - name: Build Binary
        run: |
          echo "Building Go application..."
          go mod tidy
          go build -o go-app main.go

      - name: Deploy Application
        run: |
          echo "Deploying application..."

          sudo mkdir -p /opt/go-app

          # Stop service before replacing binary
          sudo systemctl stop go-app || true

          # Replace binary
          sudo cp go-app /opt/go-app/go-app
          sudo chmod +x /opt/go-app/go-app

          # Start service again
          sudo systemctl start go-app

          # Verify service
          sudo systemctl status go-app --no-pager