name: Go CI/CD

on:
  push:
    branches: ["development"]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"

      - name: Build Binary
        run: |
          echo "Building Go application..."
          go mod tidy
          go build -o go-app main.go

      - name: Deploy Binary
        run: |
          echo "Deploying application..."

          # Ensure deployment directory exists
          sudo mkdir -p /opt/go-app

          # Copy new binary
          sudo cp go-app /opt/go-app/go-app

          # Make executable
          sudo chmod +x /opt/go-app/go-app

      - name: Restart Service
        run: |
          echo "Restarting Go service..."

          sudo systemctl restart go-app

          echo "Service status:"
          sudo systemctl status go-app --no-pager