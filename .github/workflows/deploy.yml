name: Go CI/CD

on:
  push:
    branches: ["development"]
  merge_group:
    branches: ["development"]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"

      - name: Build
        run: |
          go build -v -o go-app main.go

      - name: Deploy to Local Server
        run: |
          # Kill old process
          pkill -f go-app || true

          # Ensure executable permission
          chmod +x go-app

          # Start server detached from runner
          setsid ./go-app > app.log 2>&1 < /dev/null &

          sleep 2
          ps aux | grep go-app || true

          echo "Deployment successful!"