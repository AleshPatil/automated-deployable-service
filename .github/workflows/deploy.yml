name: Go CI/CD

on:
  push:
    branches: [ "development" ]
  merge_group:
    branches: [ "development" ]

jobs:

  build-and-deploy:
    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'

    - name: Build
      run: go build -v -o go-app main.go

    - name: Deploy to Local Server
      run: |
        # Kill the existing process if it's running
        pkill go-app || true
        
        # Start the new process in the background
        nohup ./go-app > app.log 2>&1 &
        
        echo "Deployment successful!"
